<style>
:root{--lavender:#e9deff;--pink:#ffd7e5;--butter:#fff0b8;--blue:#cbe9ff;--cream:#fffdf9;--ink:#302846;--violet:#62418d;--muted:#625b70}
*{box-sizing:border-box}html,body{width:1200px;height:627px;margin:0;overflow:hidden}
