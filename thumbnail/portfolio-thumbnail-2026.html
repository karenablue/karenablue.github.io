<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Designed by Karena — Share thumbnail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Matches the live site: white paper, ink type, one purple accent (site.css tokens). */
    :root { --bg:#f8f8fc; --paper:#fff; --ink:#12151f; --muted:#4b5160; --line:#dcdad2; --purple:#5a5ab4; --purple-dark:#43439a; --tint:#eeeef9; }
    * { box-sizing:border-box; }
    html,body { width:1200px; height:627px; margin:0; overflow:hidden; }
    body { font-family:Inter,Arial,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
    .canvas { position:relative; width:1200px; height:627px; overflow:hidden;
      background:radial-gradient(circle at 1px 1px,rgba(90,90,180,.10) 1px,transparent 1.4px) 0 0/25px 25px, var(--bg); }
    .content { position:absolute; left:72px; top:64px; width:600px; }
    .brand { margin:0; color:var(--purple-dark); font:700 22px/1 "Bricolage Grotesque",sans-serif; letter-spacing:-.01em; }
    h1 { margin:34px 0 0; font:700 66px/1.02 "Bricolage Grotesque",sans-serif; letter-spacing:-.035em; }
    h1 span { color:var(--purple); }
    .subtitle { margin:22px 0 0; width:520px; color:var(--muted); font-size:22px; font-weight:500; line-height:1.45; }
    .tags { display:flex; gap:10px; margin-top:28px; }
    .tags span { padding:8px 16px; border-radius:999px; background:var(--tint); color:var(--purple-dark); font-size:15px; font-weight:600; }
    .site { position:absolute; left:72px; bottom:56px; display:flex; align-items:center; gap:12px; color:var(--purple-dark); font-size:18px; font-weight:700; }
    .site::before { content:""; width:28px; height:2px; background:var(--purple); }
    .portrait { position:absolute; top:64px; right:72px; width:380px; height:499px; border-radius:24px; overflow:hidden; background:var(--paper);
      border:1px solid var(--line); box-shadow:0 1px 2px rgba(18,21,31,.05), 0 30px 60px -28px rgba(18,21,31,.35); }
    .portrait img { display:block; width:100%; height:100%; object-fit:cover; object-position:center 28%; }
    .name { position:absolute; left:16px; bottom:16px; padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.94); font:700 15px/1.3 Inter,sans-serif; }
    .name small { display:block; color:var(--muted); font-weight:500; font-size:13px; }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Designed by Karena share thumbnail">
    <div class="content">
      <p class="brand">Designed by Karena</p>
      <h1>Product designer with a <span>research edge</span>.</h1>
      <p class="subtitle">I use research to understand where people get stuck, then design clearer ways forward.</p>
      <div class="tags"><span>Product design</span><span>UX research</span><span>Prototyping</span></div>
    </div>
    <div class="portrait">
      <img src="../images/headshot.jpg" alt="Portrait of Karena Blue">
      <div class="name">Karena Blue<small>M.S. HCI candidate, DePaul University</small></div>
    </div>
    <div class="site">designedbykarena.com</div>
  </main>
</body>
</html>
