<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Designed by Karena — Share thumbnail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Matches the live homepage: lavender, cream window, butter and pink accents. */
    :root { --lavender:#e9deff; --pink:#ffd7e5; --butter:#fff0b8; --blue:#cbe9ff; --cream:#fffdf9; --ink:#302846; --violet:#62418d; --muted:#625b70; }
    * { box-sizing:border-box; }
    html,body { width:1200px; height:627px; margin:0; overflow:hidden; }
    body { font-family:"DM Sans",Arial,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
    .canvas { position:relative; width:1200px; height:627px; overflow:hidden;
      background:radial-gradient(circle at 1px 1px,rgba(98,65,141,.12) 1.3px,transparent 1.8px) 0 0/26px 26px, var(--lavender); }
    .window { position:absolute; left:60px; top:64px; width:1080px; height:499px; border:2.5px solid var(--ink); border-radius:22px; background:var(--cream); box-shadow:10px 12px 0 var(--violet); overflow:hidden; }
    .bar { display:flex; align-items:center; gap:10px; height:46px; padding:0 22px; background:var(--blue); border-bottom:2.5px solid var(--ink); font-size:15px; font-weight:600; }
    .bar i { width:12px; height:12px; border:2px solid var(--ink); border-radius:50%; background:var(--butter); }
    .bar i:nth-child(2) { background:var(--pink); } .bar i:nth-child(3) { background:#fff; }
    .bar span { margin-left:10px; }
    .portrait { position:absolute; left:52px; top:96px; width:300px; height:340px; border:2.5px solid var(--ink); border-radius:50%; overflow:hidden; background:var(--butter); box-shadow:8px 9px 0 var(--pink); }
    .portrait img { width:100%; height:100%; object-fit:cover; object-position:center 22%; }
    .copy { position:absolute; left:400px; top:76px; width:640px; }
    .kicker { margin:0; font:500 15px/1 "DM Sans",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--violet); }
    h1 { margin:14px 0 0; font:700 64px/1 "Fredoka",sans-serif; letter-spacing:-.02em; color:var(--violet); text-shadow:3px 4px 0 var(--pink); }
    h1 em { display:block; font:italic 500 40px/1.15 "Fraunces",serif; color:var(--ink); text-shadow:none; margin-top:10px; }
    .sub { margin:16px 0 0; width:560px; font-size:20px; line-height:1.4; color:var(--muted); font-weight:500; }
    .tags { display:flex; gap:10px; margin-top:20px; }
    .tags span { padding:8px 16px; border:2px solid var(--ink); border-radius:999px; background:var(--butter); font-size:15px; font-weight:700; }
    .tags span:nth-child(2) { background:var(--pink); } .tags span:nth-child(3) { background:var(--blue); }
    .site { position:absolute; left:400px; bottom:26px; font-size:19px; font-weight:700; color:var(--violet); }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Designed by Karena share thumbnail">
    <div class="window">
      <div class="bar"><i></i><i></i><i></i><span>Hello, internet. I’m Karena Blue.</span></div>
      <div class="portrait"><img src="../images/headshot.jpg" alt="Portrait of Karena Blue"></div>
      <div class="copy">
        <p class="kicker">Karena Blue · portfolio</p>
        <h1>designed by <span style="white-space:nowrap">Karena</span><em>Product designer with a research edge.</em></h1>
        <p class="sub">Research that finds where people get stuck, design that gets them unstuck.</p>
        <div class="tags"><span>Product design</span><span>UX research</span><span>Prototyping</span></div>
      </div>
      <div class="site">designedbykarena.com</div>
    </div>
  </main>
</body>
</html>
